name: build

# Every push and pull request: run the tests and build every app.
# A tag like v1.0.0 also attaches the apps to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # Offline tests only: the live ones download from TomTom and the fuel-price servers,
      # which can be slow or drop GitHub's runners. Run those locally with -Pm2t.online=1.
      - run: ./gradlew :composeApp:desktopTest

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: MapsToTom-${{ runner.os }}
          path: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/dmg/*.dmg
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main/deb/*.deb
            composeApp/build/compose/binaries/main/msi/*.msi
            composeApp/build/compose/binaries/main/dmg/*.dmg

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # Debug-signed, so it installs straight away ("install unknown apps" must be allowed).
      - run: ./gradlew :composeApp:assembleDebug
      - run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk MapsToTom-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: MapsToTom-Android, path: MapsToTom-android.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: MapsToTom-android.apk }
